[package]
name = "review-run"
version = "0.1.0"
edition = "2021"
description = "The review harness: runs a graph of reviewer child processes over a checkout and writes a bundle of every node's input and output (see docs/review-harness.md)"

[lib]
name = "review_run"
path = "src/lib.rs"

[[bin]]
name = "review-run"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
globset = "0.4.20"
regex = "1.13.1"

[profile.release]
strip = true
